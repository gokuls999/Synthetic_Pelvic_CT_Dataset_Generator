# Default configuration for the synthetic pelvic-CT generator pipeline.
# Override on the command line: `python scripts/train.py --config configs/default.yaml`.

paths:
  data_root: ct_data_for_generator/output
  masks_root: ct_data_for_generator/masks
  cache_dir: cache
  labels_csv: cache/region_labels.csv
  checkpoints_dir: checkpoints
  outputs_dir: synthetic_dataset
  logs_dir: logs

# ----- Preprocessing -----
preprocess:
  # HU window for pelvic anatomy (bone + soft tissue).
  hu_min: -200
  hu_max: 500
  # Axial slice resolution after resampling.
  slice_size: 256
  # Output voxel HU range gets mapped to [-1, 1] for training.
  # Optional pelvic ROI crop: if masks are available we use the mask bbox + margin,
  # otherwise we apply a coarse center crop on (H, W) at this fraction of the image.
  center_crop_frac: 0.85
  margin_mm: 10
  # Sample every Nth slice within the pelvic Z range. 1 = keep all slices.
  z_stride: 1
  # Skip series with fewer axial slices than this.
  min_slices_per_series: 24
  # Per-dataset enable flags (turn off the heavy ones for a fast smoke run).
  enable:
    rsna: true
    ct_colonography: true
    ctpelvic1k: true
    tcga_ucec: true
    tcga_ov: true
    tcga_cesc: true
  # Cap volumes per dataset (None = no cap). Useful for smoke runs.
  max_volumes_per_dataset: null

# ----- Pseudo-labels (Plain vs Hilly via pelvic morphometry) -----
pseudo_labels:
  # Features computed from the volume / mask: pelvic inlet width, iliac flare,
  # sacral curvature proxy. KMeans on standardized features → 2 clusters.
  n_clusters: 2
  random_state: 42
  # Mapping convention: the cluster with the *larger mean pelvic inlet width*
  # is named "plain" (broader pelvis = lowland/plain), the other "hilly".
  # This is a proxy, not biology — see README.

# ----- Model -----
model:
  # CVAE compresses 1x256x256 slices into latent_channels x latent_size x latent_size.
  cvae:
    in_channels: 1
    base_channels: 64
    latent_channels: 4
    # 256 / 64 = 4x compression (was 8x at latent_size=32). Less aggressive ->
    # preserves bone-frequency detail that TotalSegmentator can later detect.
    # First overnight run at 32 produced 0/50 anatomy pass; bones got squashed
    # away in the bottleneck. See git log for the autopsy.
    latent_size: 64
    cond_dim: 16                # embedding size for region + z-position
  diffusion:
    image_size: 64              # must match cvae.latent_size
    in_channels: 4              # = cvae.latent_channels
    base_channels: 128
    channel_mults: [1, 2, 2, 4]
    num_res_blocks: 2
    cond_dim: 16                # = cvae.cond_dim
    timesteps: 1000
    beta_schedule: linear

# ----- Training -----
training:
  device: cuda                  # falls back to cpu automatically
  # IMPORTANT: keep mixed_precision=false on Pascal-era GPUs (GTX 10xx).
  # They have no tensor cores -> fp16 is software-emulated, gives ~zero speedup
  # AND can overflow into NaN losses (we hit this on a 1080 Ti). Re-enable on
  # Turing/Ampere/Ada (RTX 20xx+) for real fp16 speed.
  mixed_precision: false
  num_workers: 2
  # Intra-epoch checkpoint frequency: save *_latest.pt every N batches so
  # a mid-epoch crash only loses up to N batches of work (vs an entire
  # ~8h epoch). 500 is roughly every 30 min on a 1080 Ti at the 64-latent.
  # Resume code loads the mid-epoch snapshot if it's newer than the last
  # per-epoch checkpoint, and restarts the in-progress epoch from batch 0
  # with the warm weights -- much faster than from cold init.
  intra_save_every_batches: 500
  cvae:
    batch_size: 16
    lr: 2.0e-4
    epochs: 20
    # Lowered from 1e-4 -> 1e-6: gives the CVAE much more latent capacity
    # (KL term no longer dominates), so high-frequency bone structure isn't
    # regularized away. The first overnight run had KL=5 at convergence with
    # 1e-4 weight, indicating the bottleneck was being aggressively flattened.
    kl_weight: 1.0e-6
    grad_accum: 1
  diffusion:
    # 64x64 latent vs the old 32x32 = 4x more pixels per batch. Drop batch
    # size 32 -> 16 to fit a 1080 Ti; the per-step compute is similar.
    batch_size: 16
    lr: 1.0e-4
    epochs: 20
    grad_accum: 2
    ema_decay: 0.999
  # Smoke mode: tiny epoch count for end-to-end testing
  smoke: false

# ----- Generation -----
generation:
  num_patients: 400
  plain_fraction: 0.5           # plain vs hilly split
  slices_per_volume: 96         # axial slice count per synthetic study
  sampler_steps: 50             # DDIM-style fast sampling (subset of timesteps)
  # Slice z-coordinate spans pelvic range; we condition the model on z so adjacent
  # slices are coherent. Higher temporal smoothing = stronger latent EMA.
  slice_smoothing: 0.3
  seed: 2026

# ----- Output -----
output:
  pixel_spacing_mm: [1.0, 1.0]
  slice_thickness_mm: 1.5
  manufacturer: "SyntheticPelvicCT"
  institution: "GenAI Pelvic Study"
  write_png: true
  write_jpg: true
  png_window: [-200, 500]       # display window for the 2D exports
